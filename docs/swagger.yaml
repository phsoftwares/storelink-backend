info:
  contact: {}
  description: StoreLink integrates stores. Administrators use JWT Bearer; each FNTS_Server
    installation uses its own fixed X-API-Key and database-validated X-Agent-ID.
  title: StoreLink API
  version: "1.0"
paths:
  /agent/heartbeat:
    post:
      consumes:
      - application/json
      parameters:
      - description: Agent ID
        in: header
        name: X-Agent-ID
        required: true
        type: string
      - description: Estado do agente
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.HeartbeatDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.AppError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.AppError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.AppError'
      security:
      - AgentAPIKey: []
      summary: Recebe estado recente do agente local
      tags:
      - Protocolo agente
  /agent/messages:
    post:
      consumes:
      - application/json
      description: Operação isolada por empresa. Identidade e autorização validadas
        pelo servidor.
      parameters:
      - description: Agent ID
        in: header
        name: X-Agent-ID
        required: true
        type: string
      - description: Dados da operação
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/models.MessageDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Message'
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Message'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.AppError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.AppError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.AppError'
